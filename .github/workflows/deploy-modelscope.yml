name: Deploy to ModelScope Studio

# 复用 chuyun-cup-yuanhezhishu-2026 验证过的部署模板，改为 Docker 类型（前后端单容器）
# 关键：魔搭 git 主机是 www.modelscope.cn/studios/<owner>/<repo>.git（不是 gitmodelscope.cn）
# 令牌用 oauth2:${MODELSCOPE_API_KEY} 做 git 鉴权，OpenAPI 用 Bearer 同令牌
# 服务端口必须 7860（8080 被平台占用）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Studio if not exists
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          if [ -z "$MODELSCOPE_API_KEY" ]; then
            echo "::error::MODELSCOPE_API_KEY secret 未配置"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
            -H "Authorization: Bearer $MODELSCOPE_API_KEY")
          if [ "$STATUS" = "404" ]; then
            echo "创建 $MS_OWNER/$MS_REPO ..."
            HTTP_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
              "https://modelscope.cn/openapi/v1/studios" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"owner\":\"$MS_OWNER\",\"repo_name\":\"$MS_REPO\",\"sdk_type\":\"docker\",\"visibility\":\"public\",\"display_name\":\"义乌小商品出海智能体\"}")
            cat /tmp/create.json
            [ "$HTTP_CODE" = "200" ] || { echo "::error::创建失败 (HTTP $HTTP_CODE)"; exit 1; }
            sleep 20
          else
            echo "创空间已存在 ($STATUS)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: demo/web/package-lock.json

      - name: Build frontend (Vite -> dist/)
        working-directory: demo/web
        run: |
          npm ci
          npm run build

      - name: Assemble Studio payload (Docker - Dockerfile at repo root)
        run: |
          mkdir -p studio
          cp -r demo/app studio/app
          cp demo/requirements.txt studio/
          cp -r demo/web/dist studio/web_dist
          cp deploy/modelscope/Dockerfile studio/Dockerfile
          cp deploy/modelscope/ms_deploy.json studio/
          find studio -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find studio -name "*.pyc" -delete 2>/dev/null || true

      - name: Push code to ModelScope (www.modelscope.cn, oauth2)
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          cd studio
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add modelscope "https://oauth2:${MODELSCOPE_API_KEY}@www.modelscope.cn/studios/${MS_OWNER}/${MS_REPO}.git"
          git fetch modelscope master || echo "远程为空，跳过 fetch"
          if git rev-parse --verify modelscope/master >/dev/null 2>&1; then
            git merge modelscope/master --allow-unrelated-histories -m "Merge remote master" || {
              git checkout --ours .; git add .; git commit -qm "Resolve conflicts, keep local"; }
          fi
          git push -f modelscope HEAD:master

      - name: Sync LLM env to ModelScope (secrets/variables)
        # 平台侧 Secrets/Variables 是容器环境的唯一来源，git 里的 .env 不会生效
        # 已存在返回 400 时改 PUT 更新
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.stepfun.com/step_plan/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'step-3.7-flash' }}
          LLM_REQUEST_EXTRAS: ${{ vars.LLM_REQUEST_EXTRAS || '{"reasoning_effort":"low"}' }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY secret 未配置，跳过同步（线上将无AI增强）"
            exit 0
          fi
          upsert() { # $1=kind $2=key $3=value
            local ep="https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}/$1"
            local code=$(curl -s -o /tmp/upsert.json -w "%{http_code}" -X POST "$ep" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" -H "Content-Type: application/json" \
              -d "{\"key\":\"$2\",\"value\":\"$3\"}")
            if [ "$code" = "400" ]; then
              code=$(curl -s -o /tmp/upsert.json -w "%{http_code}" -X PUT "$ep" \
                -H "Authorization: Bearer $MODELSCOPE_API_KEY" -H "Content-Type: application/json" \
                -d "{\"key\":\"$2\",\"value\":\"$3\"}")
            fi
            echo "sync $1/$2: HTTP $code"
          }
          upsert secrets  LLM_API_KEY  "$LLM_API_KEY"
          upsert variables LLM_BASE_URL "$LLM_BASE_URL"
          upsert variables LLM_MODEL     "$LLM_MODEL"
          upsert variables LLM_REQUEST_EXTRAS "$LLM_REQUEST_EXTRAS"

      - name: Deploy Studio (OpenAPI deploy 端点)
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST \
            "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}/deploy" \
            -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
            -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0")
          cat /tmp/deploy.json
          [ "$HTTP_CODE" = "200" ] || { echo "::error::部署触发失败 (HTTP $HTTP_CODE)"; exit 1; }

      - name: Monitor deployment
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          sleep 30
          for i in $(seq 1 30); do
            STATUS=$(curl -s "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" -H "User-Agent: Mozilla/5.0" | jq -r '.data.status // empty')
            echo "状态: $STATUS"
            if [ "$STATUS" = "Running" ]; then echo "部署成功"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Error" ]; then echo "部署失败"; exit 1; fi
            sleep 30
          done
          echo "超时"; exit 1

      - name: Smoke test (AI 生效性验证)
        # 部署成功 ≠ 功能正常：断言 ai_insight 字段存在（仅 LLM 调用成功时才返回）
        env:
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          SERVICE_URL="https://${MS_OWNER}-${MS_REPO}.ms.show"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120"
          for i in $(seq 1 10); do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -A "$UA" "$SERVICE_URL/health" || true)
            [ "$HEALTH" = "200" ] && break
            echo "等待服务就绪 (health: $HEALTH) ..."
            sleep 15
          done
          [ "$HEALTH" = "200" ] || { echo "::error::健康检查失败"; exit 1; }
          curl -s --max-time 60 -A "$UA" \
            "$SERVICE_URL/api/v1/market-insight?category=%E5%9C%A3%E8%AF%9E%E9%A5%B0%E5%93%81&region=europe" \
            -o /tmp/mi.json
          HAS_INSIGHT=$(jq -r 'has("ai_insight")' /tmp/mi.json 2>/dev/null || echo false)
          echo "ai_insight present: $HAS_INSIGHT"
          if [ "$HAS_INSIGHT" = "false" ]; then
            echo "::warning::ai_insight 缺失，LLM 未生效（检查平台 Secrets 与网关余额）"
            exit 1
          fi
          echo "冒烟测试通过：线上 AI 增强已生效"
