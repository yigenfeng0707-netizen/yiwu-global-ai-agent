name: ModelScope Studio Keepalive

# 保持创空间实例存活 + 异常自愈（免费实例空闲会休眠）
# 复用 chuyun-cup-yuanhezhishu-2026 验证过的 keepalive 模板
on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟
  workflow_dispatch:

# actions:write 用于自清理本工作流的历史 run（288次/天会刷爆 Actions 列表）
permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check status & self-heal
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'yiwu-global-ai-agent' }}
        run: |
          STATUS=$(curl -s "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
            -H "Authorization: Bearer $MODELSCOPE_API_KEY" -H "User-Agent: Mozilla/5.0" | jq -r '.data.status // empty')
          echo "studio status: $STATUS"
          if [ "$STATUS" = "Running" ]; then
            echo "运行中，唤醒健康检查..."
            SERVICE_URL="https://${MS_OWNER}-${MS_REPO}.ms.show"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              "$SERVICE_URL/health" || true)
            echo "health check: $HTTP_CODE"
          else
            echo "非 Running，触发重新部署..."
            curl -s -X POST "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}/deploy" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
              -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0"
          fi

      - name: Prune old keepalive runs (keep 1 day)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "清理 $CUTOFF 之前的 keepalive 运行记录..."
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/keepalive.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF\") | .id" \
            | sort -n | head -100 | while read id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" && echo "deleted $id" || true
            done
          echo "清理完成"
