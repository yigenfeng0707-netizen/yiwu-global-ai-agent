name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-lint-and-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # P2-6 门禁收紧：严重错误(E9,F63,F7,F82 语法/未定义名)零容忍，去 || true
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # 风格检查(行长等)显式非阻塞，仅报告不失败
          flake8 app/ --count --max-line-length=120 --statistics --exit-zero

      - name: Security scan with bandit
        run: |
          pip install bandit
          # P2-1：仅阻断 Medium+High（-ll）；Low 级别噪音大不入门禁
          # cache.py md5 已加 # nosec B324（缓存键非安全用途，误报抑制）
          bandit -r app/ -ll

      - name: Dependency audit with pip-audit
        run: |
          pip install pip-audit
          # P2-1：扫描 requirements.txt 已知漏洞（--strict 使无法解析的依赖也报错）
          pip-audit -r requirements.txt --strict

      - name: Run Python unit tests with coverage gate
        run: |
          pip install pytest-cov
          # P2-1：覆盖率门禁 ≥80%（当前实测 82%，留缓冲防回退）
          python -m pytest tests/ --tb=short -q -v \
            --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: demo/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build verification
        run: npm run build
